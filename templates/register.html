{% extends "base.html" %}{% block body %}<div class="box"><h2 style="margin-top:0">Create account</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Name</label><input name="name" required maxlength="60" value="{{ name or '' }}">
<label>Email</label><input name="email" type="email" required value="{{ email or '' }}">
<label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">
<p><button class="p">Create account</button></p></form><p class="mut">Already have an account? <a href="/login"><b>Sign in</b></a></p></div>{% endblock %}
